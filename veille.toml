# The CTO's veille (J5, ADR-0024): public feeds and settings only.
# The map of my projects lives in veille.local.toml (git-ignored); without it,
# veille.example.toml and its fictional projects.

[reglage]
# Articles published within the last 30 hours (a daily run, with some overlap).
fenetre_heures = 30
# At most this many articles go to the local model, and this many per source:
# a busy feed (arXiv) must not crowd out the others.
max_articles = 50
max_par_source = 8
# Kept from this score (1-10), at most this many in the message.
seuil = 7
max_retenus = 12
profil = "Ingénieur IA freelance en France (EURL Gnaro) : LLM, agents IA, RAG, intégration au SI, modèles locaux ; développe en TypeScript et en Python."

