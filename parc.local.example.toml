# The machines the ronde reads and judges (ADR-0039, ADR-0040). Copy to
# parc.local.toml (git-ignored: addresses and paths of your machine).
# See deploy/serveurs/README.md, « Le bulletin ». A file apart from
# serveurs.local.toml: the ronde never sees an action key. Read again at
# every pass: no restart needed after a change.
#
#   known_hosts     Cénacle's own known_hosts, the servers' fingerprints pinned
#   nom             the machine as the page shows it (Legion's name, for the comparison)
#   adresse         its host name (Tailscale)
#   compte          the dedicated account on it, never root
#   cle             its read-only key, locked on cenacle-bulletin, readable by you only
#
# What the ronde expects of it (optional; until declared, the machine is
# SOUFFRANTE — never SAIN by default):
#   hote            the host name its bulletin recites (`hote=`); another one: MALADE
#   ports           the ports expected to listen, as the bulletin recites them:
#                   tcp/22 (anywhere), local/tcp/25 (loopback), tailnet/udp/41641;
#                   jokers: tailnet/tcp/*, tailnet/udp/*, local/tcp/* (32768 and up)
#   disque_avertir  SOUFFRANT from this percent (80 by default)
#   disque_alerter  MALADE from this percent (90 by default)
#   sauvegardes     the backup verdicts its bulletin must recite (ADR-0043), among
#                   copie-dumps, veiller-sauvegardes, copie-bases, myriade-base,
#                   copie-cenacle; a declared one ill, missing, unreadable, older
#                   than 36 h or from the future: MALADE. None declared, none judged.

known_hosts = "/Users/exemple/.ssh/cenacle/known_hosts"

[[machine]]
nom = "vps-b"
adresse = "vps-b.exemple.test"
compte = "cenacle"
cle = "/Users/exemple/.ssh/cenacle/vps-b-bulletin"
hote = "vps-b"
ports = ["tcp/22", "tcp/80", "tcp/443", "local/tcp/25", "tailnet/tcp/*"]
