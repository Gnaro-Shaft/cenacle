# Mnemo n'ecoute que sur le tailnet — surcharge de mnemo-api et mnemo-mcp.
#
# Pose en /etc/systemd/system/mnemo-{api,mcp}.service.d/ecoute-tailnet.conf
# par deploy/homelab/mnemo/fermer-au-reseau-local.
#
# Pourquoi : les deux services ecoutaient sur 0.0.0.0, valeur par defaut du
# code. Le MCP n'a PAS d'authentification — son code l'assume : « Tailscale
# fait l'isolation reseau ». Sur 0.0.0.0, elle n'avait pas lieu : toute machine
# du reseau local pouvait interroger le coffre Obsidian. Constate le 25/09/2026.
#
# Les variables sont lues par pydantic-settings, et priment sur le .env de
# Mnemo. Une variable sans rapport avec le service est ignoree : le meme
# fichier sert aux deux.
#
# L'adresse est ecrite en dur sur la machine, et c'est force : on ne lie pas
# un port a un nom MagicDNS. Ce fichier-ci est un modele (ADR-0045 : aucune
# adresse dans le depot) : le script de pose remplace @TAILNET@ par ce que la
# machine de Mnemo repond a « tailscale ip -4 ».

[Unit]
# Lie a l'adresse du tailnet, le service ne peut pas demarrer avant elle.
After=tailscaled.service
Wants=tailscaled.service

[Service]
Environment=MNEMO_API_HOST=@TAILNET@
Environment=MNEMO_MCP_HOST=@TAILNET@
Environment=MNEMO_MCP_METRICS_HOST=@TAILNET@
# Sans elle, le MCP chercherait l'API a son adresse par defaut — que l'API
# n'ecoute plus.
Environment=MNEMO_MCP_API_URL=http://@TAILNET@:8000
# Au demarrage, l'adresse du tailnet arrive apres tailscaled. Au rythme par
# defaut (100 ms), cinq echecs en dix secondes et systemd abandonne l'unite
# pour de bon. Cinq secondes laissent le temps a l'adresse d'arriver.
RestartSec=5
