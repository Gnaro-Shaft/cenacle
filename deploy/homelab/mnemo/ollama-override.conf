# Ollama n'ecoute qu'en boucle locale.
#
# Remplace /etc/systemd/system/ollama.service.d/override.conf, qui portait
# OLLAMA_HOST=0.0.0.0:11434 — l'ancien est garde a cote, en .bak-avant-<date>.
# On remplace plutot qu'ajouter : les surcharges se lisent dans l'ordre
# alphabetique, et un fichier « ollama-*.conf » serait ecrase par
# « override.conf ».
#
# Pourquoi : Ollama n'a pas d'authentification, et ecoutait sur toutes les
# interfaces. Sur les sept jours releves le 25/09/2026, ses 217 requetes
# venaient toutes de la machine elle-meme — Mnemo, pour ses embeddings. Aucun
# autre client n'a donc de raison de le joindre.

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Nombre de threads de calcul (ajout du 28/09/2026).
#
# Ollama ne passe pas -t a llama-server : llama.cpp prend alors les 8 coeurs
# physiques de l hote (i9-9980HK), et non les CPU du conteneur de Mnemo
# (cores = 6). Trop de threads pour trop peu de CPU : bge-m3 etait 5 a 7 fois
# plus lent (mesures dans Myriade, ADR-002).
# Ollama n a pas de variable pour ca ; llama-server lit LLAMA_ARG_THREADS,
# herite de ce service. Un client qui envoie options.num_thread garde la main
# (-t prime sur la variable).
# 5 et non 6 : meme debit mesure, et un coeur reste aux autres services.
# LIE A cores = 6 : si le nombre de coeurs du conteneur change, revoir cette valeur.
Environment="LLAMA_ARG_THREADS=5"
