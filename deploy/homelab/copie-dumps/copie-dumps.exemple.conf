# /etc/default/copie-dumps — un exemple FICTIF (ADR-0045) : écris le vrai sur
# chaque nœud, root seul (600). Jamais dans le dépôt : il porte de vrais noms.
#
# Sur le nœud de sauvegarde (copie-dumps.service) : la source est l'autre nœud.
# Sur l'autre nœud (copie-dumps-retour.service) : la source est le nœud de
# sauvegarde. La destination : un dossier local, sur le volume des sauvegardes.

COPIE_SOURCE=root@192.0.2.10:/var/lib/vz/dump/
COPIE_DEST=/var/backups/noeud-exemple-dump
