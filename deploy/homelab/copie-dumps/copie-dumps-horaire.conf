# À poser dans /etc/systemd/system/copie-dumps.timer.d/horaire.conf sur le nœud de sauvegarde.
#
# 04:15 et non le 03:00 de `copie-dumps.timer` : une tâche `vzdump` quotidienne
# démarre à 03:00 depuis octobre 2026. Le 23/10, un `.tar.dat` y a été copié en
# cours d'écriture.

[Timer]
OnCalendar=
OnCalendar=*-*-* 04:15:00
