# À poser dans /etc/systemd/system/fstrim.timer.d/quotidien.conf sur le nœud de sauvegarde.
#
# `/srv/sauvegardes` est un volume de 200 Go posé sur un pool thin de 188 Go, et
# un bloc supprimé ne revient au pool qu'au `fstrim`. Une fois par semaine, le
# pool a saturé le 31/10/2026 alors que `df` annonçait 50 Go libres : neuf dumps
# sont restés troués.
#
# 06:00 : après la copie des dumps (04:15) et restic (05:00, fini vers 05:10 le
# samedi), pour rendre tout de suite ce que leurs élagages ont libéré.

[Timer]
OnCalendar=
OnCalendar=*-*-* 06:00:00
RandomizedDelaySec=0
AccuracySec=5min
