name: Mirror CI images

# Copies the images the CI needs into this repository's GitHub registry,
# digest for digest, so that the CI depends neither on Docker Hub's anonymous
# pull limit nor on a public mirror's data limit. Run by hand, once per version.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PostgreSQL's official image, pinned by its digest on Docker Hub.
          - source: docker.io/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            digest: sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            target: postgres:18-alpine
          # GreenMail's official image (Apache 2.0), pinned by its digest on Docker Hub.
          - source: docker.io/greenmail/standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
            digest: sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
            target: greenmail-standalone:2.1.14
    env:
      SOURCE: ${{ matrix.source }}
      SOURCE_DIGEST: ${{ matrix.digest }}
      TARGET: ghcr.io/${{ github.repository_owner }}/${{ matrix.target }}
    steps:
      - name: Log in to the GitHub registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Copy, digest for digest
        run: docker buildx imagetools create --tag "${TARGET,,}" "$SOURCE"
      - name: Refuse a copy that is not the same image
        run: |
          copied=$(docker buildx imagetools inspect "${TARGET,,}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "source $SOURCE_DIGEST"
          echo "copy   $copied"
          test "$copied" = "$SOURCE_DIGEST"
