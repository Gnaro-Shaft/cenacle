name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To pull GreenMail's copy from this repository's GitHub registry.
      packages: read
    env:
      # Throwaway values for the CI database only — not secrets.
      CENACLE_DB_PORT: "55432"
      CENACLE_DB_OWNER_PASSWORD: ci_owner_only_for_ci_0000
      CENACLE_DB_APP_PASSWORD: ci_app_only_for_ci_00000
      CENACLE_DB_EXECUTOR_PASSWORD: ci_executor_only_for_ci_0
      CENACLE_TEST_MAIL_PASSWORD: ci_test_mailbox_only_000
    services:
      db:
        # From AWS's public mirror of Docker's official images, pinned by digest:
        # the very image of docker.io/library/postgres:18-alpine (same digest),
        # without Docker Hub's anonymous pull limit, which failed the CI.
        image: public.ecr.aws/docker/library/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: cenacle_owner
          POSTGRES_PASSWORD: ci_owner_only_for_ci_0000
          POSTGRES_DB: cenacle
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cenacle_owner -d cenacle"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mail:
        # GreenMail has no public mirror: mirror-images.yml copied its official
        # image here, digest for digest (sha256:1ef9…1626, same as Docker Hub).
        image: ghcr.io/gnaro-shaft/greenmail-standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=test-cenacle:ci_test_mailbox_only_000@cenacle.test
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --config /repo/.gitleaks.toml
