name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To pull PostgreSQL's and GreenMail's copies from this repository's
      # GitHub registry.
      packages: read
    env:
      # Throwaway values for the CI database only — not secrets.
      CENACLE_DB_PORT: "55432"
      CENACLE_DB_OWNER_PASSWORD: ci_owner_only_for_ci_0000
      CENACLE_TEST_PG_IMAGE: ghcr.io/gnaro-shaft/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
      CENACLE_DB_APP_PASSWORD: ci_app_only_for_ci_00000
      CENACLE_DB_EXECUTOR_PASSWORD: ci_executor_only_for_ci_0
      CENACLE_TEST_MAIL_PASSWORD: ci_test_mailbox_only_000
    services:
      db:
        # Docker Hub's anonymous pull limit, then ECR Public's data limit, failed
        # the CI: mirror-images.yml copied the official image here, digest for
        # digest (sha256:77f5…873, same as docker.io/library/postgres:18-alpine).
        image: ghcr.io/gnaro-shaft/postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          # As compose.yaml (ADR-0038): the image makes the superuser, the
          # owner is made without it by the step "The owner, without superuser".
          POSTGRES_USER: cenacle_admin
          # Nobody logs in as the superuser in CI (the init step uses the local
          # socket): its password is drawn per run, never written down.
          POSTGRES_PASSWORD: ${{ format('ci-{0}-{1}-admin', github.run_id, github.run_attempt) }}
          POSTGRES_DB: cenacle
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U cenacle_admin -d cenacle"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mail:
        # GreenMail has no public mirror: mirror-images.yml copied its official
        # image here, digest for digest (sha256:1ef9…1626, same as Docker Hub).
        image: ghcr.io/gnaro-shaft/greenmail-standalone:2.1.14@sha256:1ef95a966418cd09b7ea91d504d8c0826bbe7a2f6e679a75c601a831587c1626
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=test-cenacle:ci_test_mailbox_only_000@cenacle.test
        ports:
          - 3025:3025
          - 3143:3143
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The switch's test (ADR-0038) starts a throwaway Postgres of its own:
      # from this repository's copy, never Docker Hub's anonymous pulls.
      - name: Log in to this repository's registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # A service container cannot mount the init scripts: the CI runs the
      # very script a fresh volume runs (deploy/postgres/initdb), inside it.
      - name: The owner, without superuser
        run: |
          id='${{ job.services.db.id }}'
          # The image's init server listens on the socket only: TCP ready means init is over.
          until docker exec "$id" pg_isready -q -h 127.0.0.1; do sleep 1; done
          docker cp deploy/postgres/initdb/10-proprietaire.sh "$id:/tmp/10-proprietaire.sh"
          docker exec -e CENACLE_DB_OWNER_PASSWORD "$id" sh /tmp/10-proprietaire.sh
      - name: A throwaway password for the copy's role (ADR-0044), drawn at each run
        run: echo "CENACLE_DB_COPIE_PASSWORD=ci_$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the whole history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --config /repo/.gitleaks.toml
