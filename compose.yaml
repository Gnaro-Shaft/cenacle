# Local services for Cénacle. Everything listens on 127.0.0.1 only.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The superuser (ADR-0038): the image creates it, it stays rare and manual.
      POSTGRES_USER: cenacle_admin
      POSTGRES_PASSWORD: ${CENACLE_DB_ADMIN_PASSWORD:?set CENACLE_DB_ADMIN_PASSWORD in .env.admin}
      POSTGRES_DB: cenacle
      # Read once, on a fresh volume, by initdb/10-proprietaire.sh.
      CENACLE_DB_OWNER_PASSWORD: ${CENACLE_DB_OWNER_PASSWORD:?set CENACLE_DB_OWNER_PASSWORD in .env.owner}
    ports:
      - "127.0.0.1:${CENACLE_DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cenacle_admin -d cenacle"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Test mail server (phase 2) — fictional mailbox only, in memory, local only.
  mail:
    image: greenmail/standalone:2.1.14
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test-cenacle:${CENACLE_TEST_MAIL_PASSWORD:?set CENACLE_TEST_MAIL_PASSWORD in .env.mail}@cenacle.test
    ports:
      - "127.0.0.1:3025:3025" # SMTP
      - "127.0.0.1:3143:3143" # IMAP

  # Observability (milestone J8) — started only with: npm run obs:up
  tempo:
    profiles: ["obs"]
    image: grafana/tempo:3.0.3
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:4318:4318" # OTLP/HTTP, from Cénacle's processes

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    depends_on: [tempo]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.obs}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No telemetry, no update checks, no downloaded plugins.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
  tempo-data:
  grafana-data:
