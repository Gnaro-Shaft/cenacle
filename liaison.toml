# The liaison with the house (ADR-0048): versioned, public. Off, nothing is
# handed over to the house and nothing is read from it. Anything but
# `actif = true` or `actif = false` is unreadable: the liaison stops and says so.
# The VM's name, the account, the key and the folders live in liaison.local.toml.
[liaison]
actif = true
